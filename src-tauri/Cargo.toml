[package]
name = "musicbox"
version = "0.1.0"
description = "A modern Feishin-inspired local desktop music player"
authors = ["cbladeOfficial"]
edition = "2024"
rust-version = "1.90"

[[bin]]
name = "MusicBox"
path = "src/main.rs"

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.12.5", features = ["image-png", "image-ico"] }
tauri-plugin-log = "2"
tauri-plugin-dialog = "2"
lofty = "0.25"
rusqlite = { version = "0.42", features = ["bundled"] }
discord-rich-presence = "1.1"
tiny_http = "0.12"
walkdir = "2"
base64 = "0.22"
ureq = "3.5.2"
tauri-plugin-single-instance = "2"

[target.'cfg(windows)'.dependencies.windows]
version = "0.62"
features = [
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
    "Win32_Foundation",
    "Win32_System_Com",
    "Win32_Graphics_Gdi",
    "Win32_System_Registry",
]

